name: Build Saif Fuel Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore SaifFuelMod.csproj

      - name: Build
        run: msbuild SaifFuelMod.csproj /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Saif-Fuel-Mod
          path: bin\Release\
