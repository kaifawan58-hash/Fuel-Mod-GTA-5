name: Build SaifFuelMod

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SaifFuelMod.csproj

      - name: Build (Release)
        run: dotnet build SaifFuelMod.csproj -c Release -o build_output

      - name: Upload compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: SaifFuelMod-dll
          path: build_output/SaifFuelMod.dll
